name: uptime
# Off-server monitor: runs on GitHub, so it still reports when the Coolify server is down. A failed run emails the repository watchers.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ops/uptime_check.py
