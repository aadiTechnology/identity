{% extends "base.html" %}
{% block body %}
<h1>Sign in</h1>
<p class="muted">One account for all your Aadi products.</p>
{% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
{% if notice %}<p class="muted">{{ notice }}</p>{% endif %}
<form method="post" action="/login">
<input type="hidden" name="csrf" value="{{ csrf }}">
<input type="hidden" name="next" value="{{ next }}">
<label for="email">Email</label>
<input id="email" name="email" type="email" autocomplete="username" required autofocus value="{{ email or '' }}">
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button>
</form>
<div class="foot"><a href="/forgot">Forgot password?</a></div>
{% endblock %}
