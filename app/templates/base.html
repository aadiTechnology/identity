<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sign in{% endblock %} · Aadi</title>
<style>
:root{--bg:#F3F5F8;--surface:#fff;--fg:#16202E;--muted:#5B6678;--line:#D6DCE6;--brand:#2B55D6;--bad:#B3321F;--badbg:#FADDD7;--hover:#EAEEF4}
@media (prefers-color-scheme:dark){:root{--bg:#0F1520;--surface:#171F2D;--fg:#E6EBF3;--muted:#93A0B5;--line:#2E3A4D;--brand:#7FA0FF;--bad:#FF8F7C;--badbg:#4A1E17;--hover:#1F2938}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
main{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:600;margin-bottom:14px}
h1{font-size:21px;margin:0 0 6px}p{margin:0 0 14px}.muted{color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=email],input[type=password],input[type=text]{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit}
button,.btn{display:block;width:100%;margin-top:16px;padding:11px;border:0;border-radius:7px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-align:center;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.err{background:var(--badbg);color:var(--bad);padding:9px 11px;border-radius:7px;margin-bottom:12px;font-size:14px}
a{color:var(--brand)}
.list{display:grid;gap:8px;margin:14px 0 0;padding:0;list-style:none}
.list a.item{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:8px;color:var(--fg);text-decoration:none}
.list a.item:hover{background:var(--hover)}
.list small{display:block;color:var(--muted)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 0}
.foot{margin-top:18px;font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<main>
<div class="logo" aria-hidden="true">A</div>
{% block body %}{% endblock %}
</main>
</body>
</html>
