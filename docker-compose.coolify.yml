# Coolify "Docker Compose" resource. Set the domain of the app service to https://id.aadiprojecttracker.aaditechnology.com (port 8000).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SERVICE_FQDN_APP_8000
      - APP_ENV=${APP_ENV:-production}
      - APP_SEED_DEMO=${APP_SEED_DEMO:-false}
      - ISSUER=${ISSUER:-https://id.aadiprojecttracker.aaditechnology.com}
      - COOKIE_SECURE=true
      - DATABASE_URL=postgresql+psycopg://identity:${POSTGRES_PASSWORD}@postgres:5432/identity
      - SIGNING_KEY_PEM=${SIGNING_KEY_PEM:-}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-smtp}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@aaditechnology.com}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=identity
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=identity
    volumes:
      - identity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  identity_pgdata:
